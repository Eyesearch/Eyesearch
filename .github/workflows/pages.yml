name: Deploy web to GitHub Pages

# Two deployments, one site.
#
# GitHub Pages publishes a single artifact per deployment, so the production
# site and the staging preview are assembled together and shipped as one tree:
#
#   https://eyesearch.github.io/Eyesearch/          production, from main
#   https://eyesearch.github.io/Eyesearch/develop/  staging,    from develop
#
# Whichever branch triggered the run, the artifact is built the same way — main
# at the root, develop under /develop/ — so the two halves can never drift, and
# a push to develop re-publishes production byte-for-byte from main rather than
# from the branch under test. Production content comes from main and nowhere
# else.
#
# The web client is written with relative paths throughout (./), which is what
# lets the same files run at the root and under a subpath: every module, the
# manifest, and the service worker's scope resolve against where the files sit.
on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/**"
  # A pull request runs the tests and nothing else. The deploy job is guarded
  # below, so a red deploy — or a branch the github-pages environment does not
  # allow — can never be the thing that fails a review.
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; let an in-flight one finish. A
# cancelled deployment can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tests drive real Chromium rather than a jsdom shim, and they call it
      # as `chromium`. The current image ships that binary, but the name has
      # moved between images before, so the google-chrome build stands in when
      # it is missing.
      - name: Make chromium available to the tests
        run: |
          if ! command -v chromium >/dev/null 2>&1; then
            if command -v google-chrome >/dev/null 2>&1; then
              sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium
            else
              echo "::error::neither chromium nor google-chrome is on this runner"
              exit 1
            fi
          fi
          chromium --version

      - name: Run the web test suite
        run: |
          set -euo pipefail
          for file in web/tests/*.test.mjs; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done

  deploy:
    name: Build and deploy web/
    needs: test
    # Publishing is for pushes and manual runs only. A pull request is here to
    # be tested, not deployed, and it must not depend on the deploy job's
    # outcome to be green.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub refuses a deployment from a branch the github-pages environment
      # does not list — before the first step runs, so the job dies in a second
      # with no log to read. Say it here instead, where someone will see it.
      #
      # `main` and `develop` are both allowed in the repository settings today
      # (Settings -> Environments -> github-pages -> Deployment branches); this
      # list mirrors them and exists for the next branch someone adds.
      - name: Note on the deployment branch policy
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
        run: |
          echo "::notice title=Deployment branch policy::A run from ${GITHUB_REF_NAME} can only publish if that branch is allowed to deploy to the github-pages environment (Settings -> Environments -> github-pages -> Deployment branches). Otherwise GitHub refuses the deployment before any step runs."
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Checkout staging (develop)
        id: staging
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: develop
          path: dev

      - name: Assemble the site
        run: |
          set -euo pipefail

          # Production is main's web/, at the root. Nothing else may write there.
          test -f prod/web/index.html
          rm -rf site
          mkdir -p site
          cp -R prod/web/. site/

          if [ -f dev/web/index.html ]; then
            mkdir -p site/develop
            cp -R dev/web/. site/develop/

            # Staging must never be mistaken for production: it is the same app
            # on the same origin, so a reader who lands on it needs to know, and
            # a crawler needs to leave it alone.
            #
            # The script comes out of the develop checkout, not the workspace
            # root: the checkouts live in prod/ and dev/, and nothing is checked
            # out where this step runs. Using develop's own copy also means the
            # preview is marked by the branch it is previewing.
            test -f dev/.github/scripts/mark-staging.py
            python3 dev/.github/scripts/mark-staging.py site/develop

            echo "staging: included from develop"
          else
            echo "::warning::develop has no web/index.html; publishing production only"
          fi

          # Fail before the upload rather than after: an empty or malformed tree
          # deployed over the live site takes production down.
          test -f site/index.html
          test -f site/app.js
          test -f site/sw.js
          echo "--- site root ---"
          ls site
          if [ -d site/develop ]; then
            echo "--- staging ---"
            ls site/develop
          fi

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
