<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EyeSearch — unified web search</title>
  <meta name="description" content="EyeSearch is a unified search gateway: one query, results from the live web, clean answers for humans and AI agents." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <a class="skip-link" href="#results">Skip to results</a>

  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="brand brand-sm" href="./" aria-label="EyeSearch home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">EyeSearch</span>
      </a>
      <form class="searchbar searchbar-compact" id="search-form-compact" role="search" autocomplete="off">
        <svg class="searchbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input
          id="q-compact"
          name="q"
          type="search"
          inputmode="search"
          enterkeyhint="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search the web…"
          aria-label="Search query"
        />
        <button type="button" class="btn-clear" data-clear="compact" hidden aria-label="Clear search">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        </button>
        <button type="submit" class="btn-submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </form>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="hero">
      <div class="hero-inner">
        <a class="brand" href="./" aria-label="EyeSearch home">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">Eye<span class="brand-accent">Search</span></span>
        </a>
        <p class="tagline">One query. The whole web. Clean results for people and agents.</p>

        <form class="searchbar searchbar-hero" id="search-form" role="search" autocomplete="off">
          <svg class="searchbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input
            id="q"
            name="q"
            type="search"
            inputmode="search"
            enterkeyhint="search"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search the web…"
            aria-label="Search query"
            aria-describedby="search-help"
          />
          <button type="button" class="btn-clear" data-clear="hero" hidden aria-label="Clear search">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
          <button type="submit" class="btn-submit" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </form>

        <p class="search-help" id="search-help">Results appear as you type. Press <kbd>/</kbd> to focus, <kbd>Esc</kbd> to clear.</p>

        <ul class="chips" id="chips" aria-label="Suggested searches">
          <li><button type="button" data-suggestion="Kannada literature today">Kannada literature</button></li>
          <li><button type="button" data-suggestion="ISRO Chandrayaan 3 landing site">Chandrayaan 3</button></li>
          <li><button type="button" data-suggestion="Namma Metro purple line timings">Namma Metro</button></li>
          <li><button type="button" data-suggestion="best filter coffee in Bengaluru">Filter coffee</button></li>
        </ul>
      </div>
    </section>

    <section class="results-wrap" id="results-wrap" hidden aria-labelledby="results-heading">
      <h2 class="visually-hidden" id="results-heading">Search results</h2>
      <div class="meta-bar">
        <span class="meta-status" id="meta-status" role="status" aria-live="polite"></span>
        <span class="badge badge-warn" id="badge-degraded" hidden></span>
        <span class="badge badge-soft" id="badge-cache" hidden>Cached</span>
        <span class="badge badge-soft" id="badge-providers" hidden></span>
      </div>
      <ol class="results" id="results" aria-busy="false"></ol>
      <div class="state" id="state" hidden></div>
      <button type="button" class="btn-more" id="btn-retry" hidden>Try again</button>
    </section>
  </main>

  <footer class="footer">
    <p>
      EyeSearch gateway · <a href="https://github.com/Eyesearch/Eyesearch-Backend" rel="noopener noreferrer" target="_blank">API</a>
      · Results are fetched live from the open web.
    </p>
  </footer>

  <template id="tpl-card">
    <li class="card">
      <div class="card-media" hidden>
        <img alt="" loading="lazy" decoding="async" />
      </div>
      <div class="card-body">
        <div class="card-top">
          <span class="favicon" aria-hidden="true">
            <img alt="" width="20" height="20" loading="lazy" decoding="async" />
            <span class="favicon-fallback" hidden></span>
          </span>
          <span class="breadcrumb"></span>
          <span class="kind" hidden></span>
        </div>
        <h3 class="card-title"><a target="_blank" rel="noopener noreferrer"></a></h3>
        <p class="card-snippet"></p>
      </div>
    </li>
  </template>

  <template id="tpl-skeleton">
    <li class="card card-skeleton" aria-hidden="true">
      <div class="card-body">
        <div class="card-top"><span class="sk sk-favicon"></span><span class="sk sk-breadcrumb"></span></div>
        <div class="sk sk-title"></div>
        <div class="sk sk-line"></div>
        <div class="sk sk-line sk-line-short"></div>
      </div>
    </li>
  </template>

  <script src="assets/config.js"></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
