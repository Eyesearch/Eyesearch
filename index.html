<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EyeSearch</title>
  <!-- Instant redirect for hosts that serve the repository root (for example a
       branch-based GitHub Pages deployment). The canonical app lives in web/. -->
  <meta http-equiv="refresh" content="0; url=./web/" />
  <link rel="canonical" href="./web/" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0b0c0e;
      color: #eceef2;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #6c9bff; }
    p { margin: 0 0 6px; }
    .muted { color: #a2a9b4; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p>Opening EyeSearch…</p>
    <p class="muted">If nothing happens, <a href="./web/">continue to the search app</a>.</p>
  </main>
  <script>
    // Belt and braces: meta refresh is disabled by some clients, and a hard
    // location replace keeps the browser history clean.
    location.replace("./web/");
  </script>
</body>
</html>
