# Netlify: static site served from web/, no build step.
[build]
  base = "web"
  publish = "."
  command = ""

# The API lives on the VM over plain HTTP. Proxying it here keeps the browser
# on HTTPS and avoids a mixed-content block; the hop to the VM is server-side.
# Replace the host when the API gets its own domain.
[[redirects]]
  from = "/v1/*"
  to = "http://35.255.20.40:8000/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "http://35.255.20.40:8000/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(self), microphone=(self)"

[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
