# Netlify: static site served from web/, no build step.
[build]
  base = "web"
  publish = "."
  command = ""

# Not used by the GitHub Pages deployment, which cannot proxy. Kept correct for
# anyone serving this from Netlify: the API now has its own TLS domain, so this
# proxies to https rather than to the VM's plain-HTTP address.
[[redirects]]
  from = "/v1/*"
  to = "https://eyesearch.duckdns.org/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://eyesearch.duckdns.org/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(self), microphone=(self)"

[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
