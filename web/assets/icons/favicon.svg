<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EyeSearch">
  <!-- Maskable-safe: all art sits within the central 80% safe zone, so a
       circular or squircle launcher mask never clips the eye. -->
