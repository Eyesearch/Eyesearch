  <circle cx="30" cy="30" r="11" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  <circle cx="30" cy="30" r="3.8" fill="#5B8DEF" />
  <path d="M38.5 38.5 46 46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
</svg>
