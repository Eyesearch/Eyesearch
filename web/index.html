<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>eyesearch</title>
  <meta name="description" content="eyesearch — a unified search gateway. One query, live web results, clean cards." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="eyesearch" />
  <link rel="manifest" href="./manifest.json" />
  <!-- Lets Chromium, Firefox and Brave install eyesearch as a search engine. -->
  <link
    rel="search"
    type="application/opensearchdescription+xml"
    title="eyesearch"
    href="https://eyesearch.duckdns.org/opensearch.xml"
  />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="./home/search-input/search-input.css" />
  <link rel="stylesheet" href="./results/result-cards/card-renderer.css" />
  <link rel="stylesheet" href="./results/ai-chat/chat-panel.css" />
</head>
<body>
  <a class="skip-link" href="#results-region">Skip to results</a>

  <!-- Top bar: back arrow · centered wordmark · theme + profile -->
  <header class="app-bar">
    <div class="app-bar-left">
      <button class="icon-button back-button" type="button" data-action="go-home" aria-label="Back to home" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <a class="app-brand" href="./" data-action="go-home" aria-label="eyesearch home">
      <span class="app-brand-mark" aria-hidden="true"></span>
      <span class="app-brand-text">eyesearch</span>
    </a>

    <div class="app-bar-right">
      <div class="mount mount-menu" data-mount="menu"></div>
      <button class="icon-button" type="button" data-action="toggle-profile" aria-expanded="false" aria-controls="profile-panel" aria-label="Profile and history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.8 20c.9-3.5 3.8-5.4 7.2-5.4s6.3 1.9 7.2 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- profile popover: account placeholder, recent searches, entry to the history screen -->
  <aside class="profile-panel" id="profile-panel" hidden>
    <div class="mount" data-mount="account"></div>
    <div class="mount" data-mount="history"></div>
  </aside>

  <main class="app-main">
    <!-- 1. home -->
    <section class="home" id="home-section" aria-label="Search">
      <div class="home-inner">
        <h1 class="home-title">eyesearch</h1>
        <p class="home-tagline" data-i18n="tagline"></p>

        <div class="mount" data-mount="search-input"></div>
        <div class="mount" data-mount="quick-links"></div>
        <div class="mount mount-feed" data-mount="feed-cards"></div>
      </div>
    </section>

    <!-- 4. results: own search bar, then tabs, then cards -->
    <section class="results" id="results-region" hidden aria-label="Results">
      <div class="results-header">
        <div class="mount" data-mount="results-search"></div>
        <div class="mount" data-mount="nav-tabs"></div>
      </div>
      <div class="mount" data-mount="ai-chat" id="ai-chat"></div>
      <div class="mount" data-mount="result-cards" id="result-cards"></div>
      <div class="notice" id="app-notice" hidden></div>
    </section>

    <!-- full-screen history -->
    <section class="history-view" id="history-view" hidden aria-label="Search history">
      <div class="history-topbar">
        <button class="icon-button back-button" type="button" data-action="close-history" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="history-title">Search history</h2>
      </div>
      <div class="mount" data-mount="history-full"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
